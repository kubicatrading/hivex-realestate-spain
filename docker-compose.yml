version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hivex_postgis
    restart: always
    environment:
      POSTGRES_USER: hivex_user
      POSTGRES_PASSWORD: hivex_password
      POSTGRES_DB: hivex_realestate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivex_user -d hivex_realestate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
