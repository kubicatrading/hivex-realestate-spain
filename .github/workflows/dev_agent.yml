name: HIVEX DevAgent - Autonomous Coding Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Instrucción o tarea técnica para el DevAgent'
        required: true
        type: string
      telegram_chat_id:
        description: 'Chat ID de Telegram para notificaciones'
        required: false
        type: string
        default: '1450113787'
      telegram_message_id:
        description: 'Message ID para hacer reply en Telegram'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  run-dev-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Notificar Inicio en Telegram
        if: ${{ inputs.telegram_chat_id != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_INPUT: ${{ inputs.task }}
          CHAT_ID_INPUT: ${{ inputs.telegram_chat_id }}
          MSG_ID_INPUT: ${{ inputs.telegram_message_id }}
        run: |
          python - << 'PYEOF'
          import httpx, os, html
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('CHAT_ID_INPUT', '')
          msg_id = os.getenv('MSG_ID_INPUT', '')
          task = html.escape(os.getenv('TASK_INPUT', ''))
          text = f'⚙️ <b>DevAgent iniciado en GitHub Actions</b>\n\n🎯 <b>Tarea:</b> <i>{task}</i>\n\nAnalizando repositorio y preparando solución...'
          if token and chat_id:
              try:
                  httpx.post(f'https://api.telegram.org/bot{token}/sendMessage', json={
                      'chat_id': chat_id,
                      'text': text,
                      'parse_mode': 'HTML',
                      'reply_to_message_id': int(msg_id) if msg_id and msg_id.isdigit() else None
                  }, timeout=10.0)
              except Exception as e:
                  print(f'Error: {e}')
          PYEOF

      - name: Ejecutar Autonomous DevAgent
        id: dev_agent
        env:
          PAID_GEMINI_API_KEY: ${{ vars.PAID_GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_INPUT: ${{ inputs.task }}
          CHAT_ID_INPUT: ${{ inputs.telegram_chat_id }}
          MSG_ID_INPUT: ${{ inputs.telegram_message_id }}
        run: |
          python scripts/dev_agent.py \
            --task "$TASK_INPUT" \
            --chat-id "$CHAT_ID_INPUT" \
            --message-id "$MSG_ID_INPUT"

      - name: Ejecutar Tests de Verificación
        run: |
          git checkout -- hivex_local.db app/data/verified_market_catalog.json app/data/supadata_backfill_quota.json 2>/dev/null || true
          git add -A
          pytest tests/ -q 2>&1 | tee /tmp/pytest_run.log
          git checkout -- . 2>/dev/null || true

      - name: Comprobar cambios y hacer Commit & Push
        id: git_push
        env:
          TASK_INPUT: ${{ inputs.task }}
        run: |
          git config user.name "HIVEX DevAgent"
          git config user.email "devagent@hivex.internal"
          
          if ! git diff --staged --quiet; then
            DIFF_STAT=$(git diff --staged --stat | head -n 12)
            echo "has_changes=true" >> $GITHUB_OUTPUT
            ShortTask=$(printf '%s' "$TASK_INPUT" | tr '\n' ' ' | cut -c 1-72)
            git commit -m "feat(dev-agent): $ShortTask"
            git push origin main
            COMMIT_HASH=$(git rev-parse --short HEAD)
            echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
            echo "diff_stat<<EOF" >> $GITHUB_OUTPUT
            echo "$DIFF_STAT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          fi

      - name: Notificar Resultado Exitoso en Telegram
        if: success() && inputs.telegram_chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_INPUT: ${{ inputs.task }}
          CHAT_ID_INPUT: ${{ inputs.telegram_chat_id }}
          MSG_ID_INPUT: ${{ inputs.telegram_message_id }}
          HAS_CHANGES: ${{ steps.git_push.outputs.has_changes }}
          COMMIT_HASH: ${{ steps.git_push.outputs.commit_hash }}
          DIFF_STAT: ${{ steps.git_push.outputs.diff_stat }}
        run: |
          python - << 'PYEOF'
          import httpx, os, html
          from pathlib import Path
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('CHAT_ID_INPUT', '')
          msg_id = os.getenv('MSG_ID_INPUT', '')
          task = html.escape(os.getenv('TASK_INPUT', ''))
          has_changes = os.getenv('HAS_CHANGES') == 'true'
          commit = os.getenv('COMMIT_HASH', '')
          diff = html.escape(os.getenv('DIFF_STAT', ''))
          summary_path = Path('/tmp/dev_agent_summary.txt')
          summary_txt = summary_path.read_text(encoding='utf-8').strip() if summary_path.exists() else ''
          
          if has_changes:
              msg = (
                  f'✅ <b>DevAgent: Tarea completada con éxito</b>\n\n'
                  f'🎯 <b>Tarea:</b> <i>{task}</i>\n\n'
                  f'🚀 <b>Commit:</b> <code>{commit}</code> subido a <code>main</code>\n'
                  f'🧪 <b>Tests:</b> Verificación completada sin fallos.\n\n'
                  f'<pre>{diff}</pre>\n\n'
                  f'🌐 Vercel ha iniciado el despliegue automático.'
              )
          else:
              if summary_txt:
                  # El informe detallado ya fue enviado por scripts/dev_agent.py; enviamos cierre breve
                  msg = f'✅ <b>DevAgent: Diagnóstico finalizado</b> (sin cambios requeridos en repositorio).'
              else:
                  msg = (
                      f'ℹ️ <b>DevAgent: Análisis completado sin modificaciones</b>\n\n'
                      f'🎯 <b>Tarea:</b> <i>{task}</i>\n\n'
                      f'El agente concluyó la tarea sin requerir modificaciones de código.'
                  )
          
          if token and chat_id:
              try:
                  httpx.post(f'https://api.telegram.org/bot{token}/sendMessage', json={
                      'chat_id': chat_id,
                      'text': msg,
                      'parse_mode': 'HTML',
                      'reply_to_message_id': int(msg_id) if msg_id and msg_id.isdigit() else None
                  }, timeout=15.0)
              except Exception as e:
                  print(f'Error: {e}')
          PYEOF

      - name: Notificar Error en Telegram
        if: failure() && inputs.telegram_chat_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TASK_INPUT: ${{ inputs.task }}
          CHAT_ID_INPUT: ${{ inputs.telegram_chat_id }}
          MSG_ID_INPUT: ${{ inputs.telegram_message_id }}
        run: |
          python - << 'PYEOF'
          import httpx, os, html
          from pathlib import Path
          token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('CHAT_ID_INPUT', '')
          msg_id = os.getenv('MSG_ID_INPUT', '')
          task = html.escape(os.getenv('TASK_INPUT', ''))
          log_snippet = ''
          log_path = Path('/tmp/pytest_run.log')
          if log_path.exists():
              raw = log_path.read_text(errors='replace')[-1200:]
              log_snippet = f'\n\n<b>Detalle de logs:</b>\n<pre>{html.escape(raw)}</pre>'
          msg = (
              f'❌ <b>DevAgent: Error durante la ejecución</b>\n\n'
              f'🎯 <b>Tarea:</b> <i>{task}</i>\n\n'
              f'La tarea no pudo completarse o los tests fallaron.{log_snippet}'
          )
          if token and chat_id:
              try:
                  httpx.post(f'https://api.telegram.org/bot{token}/sendMessage', json={
                      'chat_id': chat_id,
                      'text': msg,
                      'parse_mode': 'HTML',
                      'reply_to_message_id': int(msg_id) if msg_id and msg_id.isdigit() else None
                  }, timeout=15.0)
              except Exception as e:
                  print(f'Error: {e}')
          PYEOF
